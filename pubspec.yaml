name: viet_di_ghep
description: Ghep giao dien tu ba thanh vien, du lieu mau trong bo nho.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0

  # State Management
  provider: ^6.1.5+1

  # Utilities
  share_plus: ^13.3.1
  http: ^1.6.0

  # Bản đồ OpenStreetMap (Đã bỏ Google Maps)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true